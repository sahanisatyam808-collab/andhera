<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Andhera 👁️</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:Georgia,serif;color:#cfc6b8}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;font-size:17px;pointer-events:none;text-shadow:0 0 6px #000}
  #ov{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:14px}
  #ov h1{font-size:40px;margin:0;color:#b3271f;letter-spacing:2px;font-weight:400}
  #ov p{margin:0;max-width:310px;line-height:1.55;color:#9a9186}
  button{background:#b3271f;color:#fff;border:0;padding:14px 30px;font-size:18px;font-family:inherit;border-radius:4px}
  button:focus-visible{outline:2px solid #fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span>Bhoot bhagaye: <b id="s">0</b></span><span>Best: <b id="b">0</b></span></div>
<div id="ov">
  <h1>ANDHERA</h1>
  <p>Raat ke 3 baj rahe hain. Ungli se torch ghumao. Bhoot andhere me chhupe hain aur dheere dheere tumhare paas aa rahe hain. Torch unpe tikao to wo gayab ho jayenge. Agar koi tum tak pahunch gaya...</p>
  <p>Headphone laga ke khelo 🎧</p>
  <button id="go">Andar jao</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);size();

const sE=document.getElementById('s'),bE=document.getElementById('b'),ov=document.getElementById('ov');
let best=0;try{best=+localStorage.getItem('andheraBest')||0}catch(e){}
bE.textContent=best;

/* ---------- audio ---------- */
let ac,droneG,beatT=0;
function initAudio(){
  if(ac)return;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),o2=ac.createOscillator();
    droneG=ac.createGain();droneG.gain.value=0.06;
    o.type='sawtooth';o.frequency.value=42;o2.type='sine';o2.frequency.value=43.5;
    const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=160;
    o.connect(f);o2.connect(f);f.connect(droneG);droneG.connect(ac.destination);
    o.start();o2.start();
  }catch(e){}
}
function thump(v){
  if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.frequency.setValueAtTime(70,ac.currentTime);o.frequency.exponentialRampToValueAtTime(35,ac.currentTime+0.15);
  g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.2);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.22);
}
function whisper(){
  if(!ac)return;
  const n=ac.sampleRate*0.9,buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);
  const s=ac.createBufferSource();s.buffer=buf;
  const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=2800;f.Q.value=3;
  const g=ac.createGain();g.gain.value=0.05;
  const p=ac.createStereoPanner?ac.createStereoPanner():null;
  if(p){p.pan.value=Math.random()*2-1;s.connect(f);f.connect(g);g.connect(p);p.connect(ac.destination)}
  else{s.connect(f);f.connect(g);g.connect(ac.destination)}
  s.start();
}
function scream(){
  if(!ac)return;
  const t=ac.currentTime,n=ac.sampleRate*1.4,buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=ac.createBufferSource();s.buffer=buf;
  const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=1.5;
  f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(3200,t+0.5);f.frequency.linearRampToValueAtTime(1500,t+1.3);
  const g=ac.createGain();g.gain.setValueAtTime(0.9,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.4);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
  const o=ac.createOscillator(),og=ac.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(380,t);o.frequency.linearRampToValueAtTime(900,t+0.4);o.frequency.linearRampToValueAtTime(300,t+1.3);
  og.gain.setValueAtTime(0.35,t);og.gain.exponentialRampToValueAtTime(0.001,t+1.3);
  o.connect(og);og.connect(ac.destination);o.start();o.stop(t+1.4);
}

/* ---------- game state ---------- */
let state='menu',ghosts=[],tx,ty,score=0,last=0,spawnIn=0,flick=1,flickT=0,shake=0,deadT=0,whisperT=3;
const R=()=>Math.min(W,H)*0.3;

function newGhost(){
  const side=Math.floor(Math.random()*4);let x,y;
  if(side===0){x=Math.random()*W;y=-40}
  else if(side===1){x=W+40;y=Math.random()*H}
  else if(side===2){x=Math.random()*W;y=H+40}
  else{x=-40;y=Math.random()*H}
  const sp=22+Math.min(score*2.2,38)+Math.random()*14;
  ghosts.push({x,y,sp,hp:1,wob:Math.random()*6,s:1});
}

function start(){
  initAudio();if(ac&&ac.state==='suspended')ac.resume();
  ghosts=[];score=0;sE.textContent=0;spawnIn=0.8;whisperT=3;shake=0;
  tx=W/2;ty=H/2;state='play';ov.style.display='none';last=performance.now();
}

function die(g){
  state='dead';deadT=0;shake=30;scream();
  if(navigator.vibrate)navigator.vibrate([200,60,300]);
  if(score>best){best=score;bE.textContent=best;try{localStorage.setItem('andheraBest',best)}catch(e){}}
  setTimeout(()=>{
    ov.innerHTML='<h1>WO PAHUNCH GAYA 💀</h1><p>Tumne '+score+' bhoot bhagaye. Best: '+best+'.</p><p>Dost ko bhejo, dekhte hain wo kitna der tikta hai.</p><button id="go">Phir se</button>';
    ov.style.display='flex';document.getElementById('go').onclick=start;
  },2300);
}

/* ---------- drawing ---------- */
function drawGhost(g,alpha,t){
  const sc=g.s,w=34*sc,h=52*sc;
  ctx.save();ctx.translate(g.x,g.y+Math.sin(t*2+g.wob)*4);ctx.globalAlpha=alpha;
  ctx.fillStyle='#d9d4c6';
  ctx.beginPath();
  ctx.moveTo(-w,h*0.5);ctx.lineTo(-w,-h*0.2);
  ctx.bezierCurveTo(-w,-h*0.9,w,-h*0.9,w,-h*0.2);
  ctx.lineTo(w,h*0.5);
  const k=5,step=(2*w)/k;
  for(let i=0;i<k;i++){const x0=w-i*step;ctx.quadraticCurveTo(x0-step/2,h*0.5+((i%2)?-14:14)*sc*0.6,x0-step,h*0.5)}
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#050505';
  ctx.beginPath();ctx.ellipse(-w*0.4,-h*0.25,w*0.2,h*0.16,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(w*0.4,-h*0.25,w*0.2,h*0.16,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,h*0.12,w*0.22,h*0.2,0,0,7);ctx.fill();
  ctx.restore();
}

function drawScare(t){
  const k=Math.min(deadT/0.25,1),sz=Math.max(W,H)*(0.6+k*1.1);
  ctx.fillStyle=(Math.floor(deadT*20)%2)?'#7a0000':'#000';ctx.fillRect(0,0,W,H);
  const g={x:W/2,y:H/2,s:sz/110,wob:0};
  ctx.save();ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawGhost(g,1,0);
  // stretched screaming mouth
  ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(W/2,H/2+sz*0.1,sz*0.12,sz*0.28,0,0,7);ctx.fill();
  ctx.restore();
}

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,0.05);last=now;const t=now/1000;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(state==='menu')return;

  if(state==='dead'){deadT+=dt;shake*=0.97;drawScare(t);return}

  // torch flicker
  flickT-=dt;
  if(flickT<=0){flick=Math.random()<0.12?0.15+Math.random()*0.3:1;flickT=0.04+Math.random()*(flick<1?0.12:1.2)}
  const r=R()*flick;

  // spawn
  spawnIn-=dt;
  if(spawnIn<=0){newGhost();spawnIn=Math.max(0.9,2.8-score*0.08)}

  // whispers
  whisperT-=dt;if(whisperT<=0){whisper();whisperT=3+Math.random()*5}

  // faint floor texture
  ctx.fillStyle='#0b0907';ctx.fillRect(0,0,W,H);

  let nearest=9999;
  for(let i=ghosts.length-1;i>=0;i--){
    const g=ghosts[i];
    const dx=W/2-g.x,dy=H/2-g.y,dist=Math.hypot(dx,dy);
    const dTorch=Math.hypot(g.x-tx,g.y-ty);
    const lit=dTorch<r*0.9;
    // lit ghosts freeze, shrink and dissolve; unlit ones creep in
    if(lit){g.hp-=dt*0.9;g.s=0.9+g.hp*0.1}
    else{g.hp=Math.min(1,g.hp+dt*0.4);g.x+=dx/dist*g.sp*dt;g.y+=dy/dist*g.sp*dt;
      g.s=1+(1-Math.min(dist/(Math.max(W,H)*0.6),1))*1.4}
    nearest=Math.min(nearest,dist);
    if(g.hp<=0){ghosts.splice(i,1);score++;sE.textContent=score;continue}
    if(dist<36){die(g);return}
    const vis=Math.max(0,1-dTorch/r);
    drawGhost(g,Math.min(1,0.03+vis*1.1)*(lit?g.hp:1),t);
  }

  // darkness with torch hole
  const grd=ctx.createRadialGradient(tx,ty,r*0.12,tx,ty,r);
  grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(0.65,'rgba(0,0,0,0.55)');grd.addColorStop(1,'rgba(0,0,0,0.985)');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  // warm tint of the beam
  const tint=ctx.createRadialGradient(tx,ty,0,tx,ty,r);
  tint.addColorStop(0,'rgba(255,214,140,'+0.12*flick+')');tint.addColorStop(1,'rgba(255,214,140,0)');
  ctx.fillStyle=tint;ctx.fillRect(0,0,W,H);

  // red vignette when a ghost is close
  const danger=Math.max(0,1-nearest/(Math.min(W,H)*0.45));
  if(danger>0){
    const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.2,W/2,H/2,Math.max(W,H)*0.75);
    v.addColorStop(0,'rgba(120,0,0,0)');v.addColorStop(1,'rgba(120,0,0,'+(danger*0.6)+')');
    ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  }

  // heartbeat gets faster when ghosts are near
  beatT-=dt;
  if(beatT<=0){const rate=0.95-danger*0.6;thump(0.25+danger*0.4);setTimeout(()=>thump(0.15+danger*0.3),130);beatT=rate}
}

function move(e){
  const p=e.touches?e.touches[0]:e;
  tx=p.clientX;ty=p.clientY-(e.touches?60:0); // torch sits above the finger
}
addEventListener('touchstart',e=>{if(state==='play')move(e)},{passive:true});
addEventListener('touchmove',e=>{if(state==='play'){e.preventDefault();move(e)}},{passive:false});
addEventListener('mousemove',e=>{if(state==='play')move(e)});
document.getElementById('go').onclick=start;
requestAnimationFrame(t=>{last=t;frame(t)});
</script>
</body>
</html>
